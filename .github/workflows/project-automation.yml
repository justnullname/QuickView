name: Project & Issue Automation

on:
  issues:
    types: [opened]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  PROJECT_OWNER: justnullname
  PROJECT_NUMBER: 1
  HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
  LABEL_IN_PROGRESS: "status: in progress"
  LABEL_IMPLEMENTED: "status: implemented"
  LABEL_PRE_RELEASE: "status: pre-release"
  LABEL_RELEASED: "status: released"
  LABEL_BLOCKED: "status: blocked"

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Project & Label Automation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const hasProjectToken = process.env.HAS_PROJECT_TOKEN === 'true';

            const LABELS = {
              inProgress: process.env.LABEL_IN_PROGRESS,
              implemented: process.env.LABEL_IMPLEMENTED,
              preRelease: process.env.LABEL_PRE_RELEASE,
              released: process.env.LABEL_RELEASED,
              blocked: process.env.LABEL_BLOCKED,
            };

            let projectMetaCache = null;

            async function getProjectMeta() {
              if (!hasProjectToken) return null;
              if (projectMetaCache) return projectMetaCache;
              const query = `
                query($login: String!, $number: Int!) {
                  user(login: $login) {
                    projectV2(number: $number) {
                      id
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField {
                          id
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              `;
              const res = await github.graphql(query, { login: projectOwner, number: projectNumber });
              const project = res?.user?.projectV2;
              if (!project) throw new Error(`Project #${projectNumber} not found for user ${projectOwner}`);
              const statusField = project.field;
              const optionsMap = {};
              for (const opt of statusField?.options || []) {
                optionsMap[opt.name] = opt.id;
              }
              projectMetaCache = {
                projectId: project.id,
                statusFieldId: statusField?.id,
                optionsMap,
              };
              return projectMetaCache;
            }

            async function addIssueToProjectAndSetStatus(issueNodeId, statusName) {
              if (!hasProjectToken) return;
              const meta = await getProjectMeta();
              const optionId = meta.optionsMap[statusName];
              if (!optionId) {
                core.warning(`Project status "${statusName}" not found.`);
                return;
              }
              const addRes = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId: meta.projectId, contentId: issueNodeId });

              const itemId = addRes?.addProjectV2ItemById?.item?.id;
              if (!itemId) return;

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: meta.projectId,
                itemId,
                fieldId: meta.statusFieldId,
                optionId,
              });
            }

            async function getIssue(issueNumber) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                if (data.pull_request) return null;
                return data;
              } catch (err) {
                core.info(`Issue #${issueNumber} not found or inaccessible: ${err.message}`);
                return null;
              }
            }

            async function syncIssueLabels(issue, addLabels, removeLabels) {
              const current = new Set((issue.labels || []).map(l => typeof l === 'string' ? l : l.name));
              const toAdd = addLabels.filter(l => l && !current.has(l));
              const toRemove = removeLabels.filter(l => l && current.has(l));

              if (toAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: toAdd,
                });
              }
              for (const label of toRemove) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: label,
                }).catch(() => {});
              }
            }

            function extractIssueNumbers(text) {
              if (!text) return [];
              const matches = [...text.matchAll(/(?<![A-Za-z0-9_])#(\d+)\b/g)];
              return [...new Set(matches.map(m => Number(m[1])))];
            }

            if (!hasProjectToken) {
              core.warning('PROJECT_TOKEN secret is not configured; skipping GitHub Project V2 board sync. Issue labels and release closing will still run.');
            }

            const eventName = context.eventName;

            // Rule A: New issue opened -> add to Project Todo
            if (eventName === 'issues' && context.payload.action === 'opened') {
              const issue = context.payload.issue;
              if (!issue.pull_request) {
                await addIssueToProjectAndSetStatus(issue.node_id, 'Todo');
              }
            }

            // Rule B: Commit pushed to main referencing #123 -> status: implemented + Project Implemented
            else if (eventName === 'push') {
              const commits = context.payload.commits || [];
              const issueNums = new Set();
              for (const c of commits) {
                for (const num of extractIssueNumbers(c.message)) {
                  issueNums.add(num);
                }
              }
              for (const num of issueNums) {
                const issue = await getIssue(num);
                if (!issue || issue.state === 'closed') continue;
                await syncIssueLabels(issue, [LABELS.implemented], [LABELS.inProgress, LABELS.blocked]);
                await addIssueToProjectAndSetStatus(issue.node_id, 'Implemented');
              }
            }

            // Rule C: Release published -> pre-release vs stable release
            else if (eventName === 'release' && context.payload.action === 'published') {
              const release = context.payload.release;
              const isPreRelease = Boolean(release.prerelease);
              const tagName = release.tag_name;
              const issueNums = extractIssueNumbers(release.body);

              for (const num of issueNums) {
                const issue = await getIssue(num);
                if (!issue) continue;

                if (isPreRelease) {
                  await syncIssueLabels(
                    issue,
                    [LABELS.preRelease],
                    [LABELS.inProgress, LABELS.implemented, LABELS.blocked]
                  );
                  await addIssueToProjectAndSetStatus(issue.node_id, 'Implemented');
                } else {
                  await syncIssueLabels(
                    issue,
                    [LABELS.released],
                    [LABELS.preRelease, LABELS.implemented, LABELS.inProgress, LABELS.blocked]
                  );
                  await addIssueToProjectAndSetStatus(issue.node_id, 'Done');
                  if (issue.state !== 'closed') {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: num,
                      body: `Released in ${tagName}. Closing this issue.`,
                    });
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: num,
                      state: 'closed',
                    });
                  }
                }
              }
            }

            // Rule D: Scheduled / manual sync from Project V2 Status -> Issue Labels
            else if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              if (!hasProjectToken) {
                core.info('Skipping scheduled Project V2 -> Label sync because PROJECT_TOKEN is not configured.');
                return;
              }
              let cursor = null;
              let hasNextPage = true;
              while (hasNextPage) {
                const res = await github.graphql(`
                  query($login: String!, $number: Int!, $cursor: String) {
                    user(login: $login) {
                      projectV2(number: $number) {
                        items(first: 100, after: $cursor) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                name
                              }
                            }
                            content {
                              ... on Issue {
                                number
                                state
                                repository {
                                  nameWithOwner
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { login: projectOwner, number: projectNumber, cursor });

                const items = res?.user?.projectV2?.items;
                for (const item of items?.nodes || []) {
                  const content = item.content;
                  if (!content || content.repository?.nameWithOwner !== `${owner}/${repo}`) continue;
                  if (content.state === 'CLOSED') continue;

                  const statusName = item.fieldValueByName?.name;
                  if (statusName === 'In Progress') {
                    const issue = await getIssue(content.number);
                    if (issue) {
                      await syncIssueLabels(
                        issue,
                        [LABELS.inProgress],
                        [LABELS.implemented, LABELS.preRelease, LABELS.released, LABELS.blocked]
                      );
                    }
                  } else if (statusName === 'Todo') {
                    const issue = await getIssue(content.number);
                    if (issue) {
                      await syncIssueLabels(issue, [], [LABELS.inProgress]);
                    }
                  }
                }
                hasNextPage = Boolean(items?.pageInfo?.hasNextPage);
                cursor = items?.pageInfo?.endCursor || null;
              }
            }
