name: Project & Issue Automation

on:
  issues:
    types: [opened]
  push:
    branches: [main, dev]
  release:
    types: [published]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  PROJECT_OWNER: justnullname
  PROJECT_NUMBER: 1
  HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
  LABEL_IN_PROGRESS: "status: in progress"
  LABEL_IMPLEMENTED: "status: implemented"
  LABEL_PRE_RELEASE: "status: pre-release"
  LABEL_RELEASED: "status: released"
  LABEL_BLOCKED: "status: blocked"
  LABEL_BUG: "type: bug"
  LABEL_ENHANCEMENT: "type: enhancement"
  LABEL_DOCUMENTATION: "type: documentation"

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Project & Label Automation
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const hasProjectToken = process.env.HAS_PROJECT_TOKEN === 'true';

            const LABELS = {
              inProgress: process.env.LABEL_IN_PROGRESS,
              implemented: process.env.LABEL_IMPLEMENTED,
              preRelease: process.env.LABEL_PRE_RELEASE,
              released: process.env.LABEL_RELEASED,
              blocked: process.env.LABEL_BLOCKED,
              bug: process.env.LABEL_BUG,
              enhancement: process.env.LABEL_ENHANCEMENT,
              documentation: process.env.LABEL_DOCUMENTATION,
            };

            let projectMetaCache = null;

            async function getProjectMeta() {
              if (!hasProjectToken) return null;
              if (projectMetaCache) return projectMetaCache;
              try {
                const res = await github.graphql(`
                  query($login: String!, $number: Int!) {
                    user(login: $login) {
                      projectV2(number: $number) {
                        id
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField {
                            id
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                `, { login: projectOwner, number: projectNumber });
                const project = res?.user?.projectV2;
                if (!project || !project.field) return null;
                projectMetaCache = {
                  projectId: project.id,
                  statusFieldId: project.field.id,
                  options: Object.fromEntries(
                    project.field.options.map((o) => [o.name, o.id])
                  ),
                };
                return projectMetaCache;
              } catch (err) {
                core.warning(`Project V2 metadata query failed: ${err.message}`);
                return null;
              }
            }

            async function addIssueToProjectAndSetStatus(issueNodeId, statusName) {
              const meta = await getProjectMeta();
              if (!meta) return;
              const optionId = meta.options[statusName];
              if (!optionId) {
                core.warning(`Status option "${statusName}" not found in Project V2.`);
                return;
              }
              try {
                const addRes = await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item {
                        id
                      }
                    }
                  }
                `, { projectId: meta.projectId, contentId: issueNodeId });
                const itemId = addRes?.addProjectV2ItemById?.item?.id;
                if (!itemId) return;
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId,
                      itemId: $itemId,
                      fieldId: $fieldId,
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `, {
                  projectId: meta.projectId,
                  itemId,
                  fieldId: meta.statusFieldId,
                  optionId,
                });
                core.info(`Set Project V2 status to "${statusName}" for item ${itemId}`);
              } catch (err) {
                core.warning(`Project V2 update failed: ${err.message}`);
              }
            }

            async function getIssue(issueNumber) {
              try {
                const { data } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });
                if (data.pull_request) return null;
                return data;
              } catch (err) {
                core.warning(`Issue #${issueNumber} not found or inaccessible: ${err.message}`);
                return null;
              }
            }

            async function syncIssueLabels(issue, addLabels, removeLabels) {
              const current = new Set((issue.labels || []).map((l) => l.name));
              for (const label of addLabels) {
                if (label && !current.has(label)) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: [label],
                  });
                }
              }
              for (const label of removeLabels) {
                if (label && current.has(label)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issue.number,
                      name: label,
                    });
                  } catch (err) {
                    core.info(`Failed to remove label "${label}" from #${issue.number}: ${err.message}`);
                  }
                }
              }
            }

            function extractIssueNumbersFromText(text) {
              const nums = new Set();
              if (!text) return [];
              const re = /#(\d+)\b/g;
              let m;
              while ((m = re.exec(text)) !== null) {
                nums.add(Number(m[1]));
              }
              return [...nums];
            }

            const eventName = context.eventName;

            // Rule A: New issue opened -> add to Project Todo & auto-label by title
            if (eventName === 'issues' && context.payload.action === 'opened') {
              const issue = context.payload.issue;
              if (!issue.pull_request) {
                await addIssueToProjectAndSetStatus(issue.node_id, 'Todo');
                const title = (issue.title || '').toLowerCase();
                const labelsToAdd = [];
                if (title.includes('[bug]') || title.includes('bug:')) {
                  labelsToAdd.push(LABELS.bug);
                }
                if (
                  title.includes('[feat]') ||
                  title.includes('[feature]') ||
                  title.includes('feat:') ||
                  title.includes('feature:')
                ) {
                  labelsToAdd.push(LABELS.enhancement);
                }
                if (title.includes('[docs]') || title.includes('docs:') || title.includes('documentation:')) {
                  labelsToAdd.push(LABELS.documentation);
                }
                if (labelsToAdd.length > 0) {
                  await syncIssueLabels(issue, labelsToAdd, []);
                }
              }
            }

            // Rule B: Push commits referencing #123 -> mark status: implemented + Project Implemented
            else if (eventName === 'push') {
              const commits = context.payload.commits || [];
              const referenced = new Set();
              for (const c of commits) {
                for (const n of extractIssueNumbersFromText(c.message)) {
                  referenced.add(n);
                }
              }
              for (const num of referenced) {
                const issue = await getIssue(num);
                if (!issue) continue;
                await syncIssueLabels(
                  issue,
                  [LABELS.implemented],
                  [LABELS.inProgress, LABELS.blocked]
                );
                await addIssueToProjectAndSetStatus(issue.node_id, 'Implemented');
              }
            }

            // Rule C: Release published -> pre-release vs stable release
            else if (eventName === 'release' && context.payload.action === 'published') {
              const release = context.payload.release;
              const tagName = release.tag_name;
              const isPrerelease = Boolean(release.prerelease);
              const referenced = new Set(extractIssueNumbersFromText(release.body));
              for (const num of referenced) {
                const issue = await getIssue(num);
                if (!issue) continue;
                if (isPrerelease) {
                  await syncIssueLabels(
                    issue,
                    [LABELS.implemented, LABELS.preRelease],
                    [LABELS.inProgress, LABELS.blocked]
                  );
                  await addIssueToProjectAndSetStatus(issue.node_id, 'Implemented');
                  const { data: comments } = await github.rest.issues.listComments({
                    owner,
                    repo,
                    issue_number: num,
                    per_page: 100,
                  });
                  const alreadyCommented = comments.some(
                    (c) => c.body && c.body.includes(tagName)
                  );
                  if (!alreadyCommented) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: num,
                      body: `Included in pre-release **${tagName}**. Please verify and share feedback if anything is still off.`,
                    });
                  }
                } else {
                  await syncIssueLabels(
                    issue,
                    [LABELS.implemented, LABELS.released],
                    [LABELS.preRelease, LABELS.inProgress, LABELS.blocked]
                  );
                  await addIssueToProjectAndSetStatus(issue.node_id, 'Done');
                  if (issue.state !== 'closed') {
                    const { data: comments } = await github.rest.issues.listComments({
                      owner,
                      repo,
                      issue_number: num,
                      per_page: 100,
                    });
                    const alreadyCommented = comments.some(
                      (c) => c.body && c.body.includes(`officially released in **${tagName}**`)
                    );
                    if (!alreadyCommented) {
                      await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: num,
                        body: `🚀 This fix/feature has been officially released in **${tagName}**! Closing this issue now—feel free to reopen or open a new one if you still encounter any problems.`,
                      });
                    }
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: num,
                      state: 'closed',
                    });
                  }
                }
              }
            }

            // Rule D: Scheduled / manual sync from Project V2 Status -> Issue Labels
            else if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              if (!hasProjectToken) {
                core.info('Skipping scheduled Project V2 -> Label sync because PROJECT_TOKEN is not configured.');
                return;
              }
              let cursor = null;
              let hasNextPage = true;
              while (hasNextPage) {
                const res = await github.graphql(`
                  query($login: String!, $number: Int!, $cursor: String) {
                    user(login: $login) {
                      projectV2(number: $number) {
                        items(first: 100, after: $cursor) {
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                          nodes {
                            fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                name
                              }
                            }
                            content {
                              ... on Issue {
                                number
                                state
                                repository {
                                  nameWithOwner
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { login: projectOwner, number: projectNumber, cursor });

                const items = res?.user?.projectV2?.items;
                for (const item of items?.nodes || []) {
                  const content = item.content;
                  if (!content || content.repository?.nameWithOwner !== `${owner}/${repo}`) continue;
                  if (content.state === 'CLOSED') continue;

                  const statusName = item.fieldValueByName?.name;
                  if (statusName === 'In Progress') {
                    const issue = await getIssue(content.number);
                    if (issue) {
                      await syncIssueLabels(
                        issue,
                        [LABELS.inProgress],
                        [LABELS.implemented, LABELS.preRelease, LABELS.released, LABELS.blocked]
                      );
                    }
                  } else if (statusName === 'Todo') {
                    const issue = await getIssue(content.number);
                    if (issue) {
                      await syncIssueLabels(issue, [], [LABELS.inProgress]);
                    }
                  }
                }
                hasNextPage = Boolean(items?.pageInfo?.hasNextPage);
                cursor = items?.pageInfo?.endCursor || null;
              }
            }
