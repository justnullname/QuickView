name: Microsoft Store Submission

permissions:
  actions: read
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to submit (leave blank for latest stable release)'
        required: false
        default: ''
      run_id:
        description: 'Optional Build & Release workflow run ID containing QuickView-Store-MSIXBundle'
        required: false
        default: ''
      no_commit:
        description: 'Upload MSIXBundle and save as draft without committing for review'
        type: boolean
        required: false
        default: false

jobs:
  submit-store:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    name: Publish MSIXBundle to Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Check Partner Center API Credentials
        id: check-secrets
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_TENANT_ID)) { $missing += "MSSTORE_TENANT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_SELLER_ID)) { $missing += "MSSTORE_SELLER_ID" }
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_CLIENT_ID)) { $missing += "MSSTORE_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_CLIENT_SECRET)) { $missing += "MSSTORE_CLIENT_SECRET" }

          if ($missing.Count -gt 0) {
            $msg = "Skipping Microsoft Store auto-submission. Missing repository secrets: $($missing -join ', ')"
            Write-Host "::notice::$msg"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Microsoft Store Submission Skipped`n`n$msg"
            "configured=false" >> $env:GITHUB_OUTPUT
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Determine Release Tag & Artifact Run ID
        id: resolve
        if: steps.check-secrets.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $customTag = "${{ inputs.release_tag }}".Trim()
          $eventTag = "${{ github.event.release.tag_name }}".Trim()

          if (-not [string]::IsNullOrEmpty($customTag)) {
            $tag = $customTag
          } elseif (-not [string]::IsNullOrEmpty($eventTag)) {
            $tag = $eventTag
          } else {
            $releaseJson = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            if ($releaseJson.prerelease -eq $true) {
              Write-Error "Latest release $($releaseJson.tag_name) is a pre-release! Store submission only accepts stable releases."
              exit 1
            }
            $tag = $releaseJson.tag_name
          }

          $runId = "${{ inputs.run_id }}".Trim()
          if ([string]::IsNullOrEmpty($runId)) {
            $runsJson = gh api "repos/${{ github.repository }}/actions/workflows/build-release.yml/runs?status=success&per_page=50" | ConvertFrom-Json
            $matchedRun = $runsJson.workflow_runs | Where-Object { $_.head_branch -eq $tag } | Select-Object -First 1
            if ($null -ne $matchedRun) {
              $runId = "$($matchedRun.id)"
            }
          }

          if ([string]::IsNullOrEmpty($runId)) {
            Write-Error "Could not locate a successful Build & Release run with QuickView-Store-MSIXBundle for tag '$tag'. Re-run Build & Release or provide run_id manually."
            exit 1
          }

          Write-Host "Resolved Stable Tag: $tag"
          Write-Host "Resolved Build Run ID: $runId"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "run_id=$runId" >> $env:GITHUB_OUTPUT

      - name: Checkout Release Notes Config
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/msstore-release-notes.json
          sparse-checkout-cone-mode: false

      - name: Download Store MSIXBundle Artifact
        if: steps.check-secrets.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "store-dist" | Out-Null
          gh run download "${{ steps.resolve.outputs.run_id }}" `
            --repo "${{ github.repository }}" `
            --name "QuickView-Store-MSIXBundle" `
            --dir "store-dist"
          Get-ChildItem -Path "store-dist" | Format-Table Name, Length

      - name: Verify MSIXBundle Contains PRI & Unplated Taskbar Assets
        if: steps.check-secrets.outputs.configured == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundles = Get-ChildItem -Path "store-dist" -Filter "*.msixbundle"
          if ($bundles.Count -ne 1) {
            Write-Error "Expected exactly 1 .msixbundle file in store-dist, found $($bundles.Count)."
            exit 1
          }
          $bundleZip = [System.IO.Compression.ZipFile]::OpenRead($bundles[0].FullName)
          try {
            $msixEntries = $bundleZip.Entries | Where-Object { $_.FullName.ToLowerInvariant().EndsWith(".msix") }
            if ($msixEntries.Count -lt 1) {
              Write-Error "MSIXBundle contains no inner .msix packages."
              exit 1
            }
            foreach ($msixEntry in $msixEntries) {
              Write-Host "Inspecting inner MSIX: $($msixEntry.FullName)"
              $ms = New-Object System.IO.MemoryStream
              $entryStream = $msixEntry.Open()
              try {
                $entryStream.CopyTo($ms)
              } finally {
                $entryStream.Dispose()
              }
              $ms.Position = 0
              $innerZip = New-Object System.IO.Compression.ZipArchive($ms, [System.IO.Compression.ZipArchiveMode]::Read)
              try {
                $map = @{}
                foreach ($ie in $innerZip.Entries) {
                  $map[$ie.FullName.ToLowerInvariant()] = $ie.Length
                }
                if (-not $map.ContainsKey("resources.pri") -or $map["resources.pri"] -le 0) {
                  Write-Error "Inner package $($msixEntry.FullName) is missing or has empty resources.pri!"
                  exit 1
                }
                if (-not $map.ContainsKey("assets/square44x44logo.targetsize-48_altform-unplated.png")) {
                  Write-Error "Inner package $($msixEntry.FullName) is missing unplated taskbar icon asset!"
                  exit 1
                }
                Write-Host "  OK: resources.pri ($($map['resources.pri']) bytes) + unplated assets present."
              } finally {
                $innerZip.Dispose()
                $ms.Dispose()
              }
            }
          } finally {
            $bundleZip.Dispose()
          }

      - name: Setup Microsoft Store Developer CLI
        if: steps.check-secrets.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure MSStore CLI Credentials
        if: steps.check-secrets.outputs.configured == 'true'
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:MSSTORE_TENANT_ID" `
            --sellerId "$env:MSSTORE_SELLER_ID" `
            --clientId "$env:MSSTORE_CLIENT_ID" `
            --clientSecret "$env:MSSTORE_CLIENT_SECRET"

      - name: Publish MSIXBundle to Microsoft Store
        if: steps.check-secrets.outputs.configured == 'true'
        shell: pwsh
        env:
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID || '9N1D85F032CC' }}
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          NO_COMMIT: ${{ inputs.no_commit == true }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          $bundles = Get-ChildItem -Path "store-dist" -Filter "*.msixbundle"
          if ($bundles.Count -ne 1) {
            Write-Error "Expected exactly 1 .msixbundle file in store-dist, found $($bundles.Count)."
            exit 1
          }
          $bundlePath = $bundles[0].FullName
          Write-Host "Uploading $bundlePath to Store App ID $env:MSSTORE_PRODUCT_ID (noCommit=$env:NO_COMMIT)..."

          # Step 1: Always upload package as draft first so we can inject localized ReleaseNotes before committing
          msstore publish $bundlePath --appId $env:MSSTORE_PRODUCT_ID --uploadTimeout 600 --noCommit
          if ($LASTEXITCODE -ne 0) {
            Write-Error "msstore publish --noCommit failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          # Step 2: Inject localized ReleaseNotes from .github/msstore-release-notes.json if version matches
          $notesFile = ".github/msstore-release-notes.json"
          $cleanTag = $env:RELEASE_TAG -replace '^v', ''
          if (Test-Path $notesFile) {
            $notesConfig = Get-Content -Raw -Encoding UTF8 $notesFile | ConvertFrom-Json
            if ($notesConfig.version -eq $cleanTag) {
              Write-Host "Fetching draft submission to inject localized ReleaseNotes for v$cleanTag..."
              $rawSubmission = msstore submission get $env:MSSTORE_PRODUCT_ID | Out-String
              $jsonStart = $rawSubmission.IndexOf('{')
              if ($jsonStart -ge 0) {
                $submission = $rawSubmission.Substring($jsonStart) | ConvertFrom-Json
                $notesMap = @{}
                foreach ($prop in $notesConfig.notes.PSObject.Properties) {
                  $k = $prop.Name.ToLowerInvariant()
                  $notesMap[$k] = $prop.Value
                  # Also index by short primary subtag (e.g. de-de -> de, fr-fr -> fr)
                  if ($k -match '^([a-z]+)-') {
                    $short = $Matches[1]
                    if (-not $notesMap.ContainsKey($short)) { $notesMap[$short] = $prop.Value }
                  }
                }
                # Map Chinese script tags (zh-hans / zh-hant) to zh-cn / zh-tw
                if ($notesMap.ContainsKey('zh-cn')) { $notesMap['zh-hans'] = $notesMap['zh-cn'] }
                if ($notesMap.ContainsKey('zh-tw')) { $notesMap['zh-hant'] = $notesMap['zh-tw'] }

                $defaultLang = if ($notesConfig.default) { $notesConfig.default.ToLowerInvariant() } else { "en-us" }
                $defaultText = $notesMap[$defaultLang]

                $updatedCount = 0
                if ($null -ne $submission.Listings) {
                  foreach ($listingProp in $submission.Listings.PSObject.Properties) {
                    $langKey = $listingProp.Name.ToLowerInvariant()
                    $text = if ($notesMap.ContainsKey($langKey)) {
                      $notesMap[$langKey]
                    } elseif ($langKey -match '^([a-z]+)-' -and $notesMap.ContainsKey($Matches[1])) {
                      $notesMap[$Matches[1]]
                    } else {
                      $defaultText
                    }
                    if (-not [string]::IsNullOrWhiteSpace($text)) {
                      if ($text.Length -gt 1500) { $text = $text.Substring(0, 1497) + "..." }
                      if ($null -ne $listingProp.Value.BaseListing) {
                        $listingProp.Value.BaseListing | Add-Member -NotePropertyName "ReleaseNotes" -NotePropertyValue $text -Force
                        $updatedCount++
                        Write-Host "  Updated ReleaseNotes for locale: $($listingProp.Name)"
                      }
                    }
                  }
                }

                if ($updatedCount -gt 0) {
                  $updatedJson = $submission | ConvertTo-Json -Depth 20 -Compress
                  $subId = $submission.id
                  if ([string]::IsNullOrWhiteSpace($subId)) { $subId = $submission.Id }

                  # Use Partner Center REST API directly to bypass Windows 32KB command-line length limit
                  $tokenResp = Invoke-RestMethod -Method Post `
                    -Uri "https://login.microsoftonline.com/$env:MSSTORE_TENANT_ID/oauth2/token" `
                    -ContentType "application/x-www-form-urlencoded" `
                    -Body @{
                      grant_type    = "client_credentials"
                      client_id     = $env:MSSTORE_CLIENT_ID
                      client_secret = $env:MSSTORE_CLIENT_SECRET
                      resource      = "https://manage.devcenter.microsoft.com"
                    }

                  $headers = @{
                    Authorization  = "Bearer $($tokenResp.access_token)"
                    "Content-Type" = "application/json; charset=utf-8"
                  }
                  $putUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:MSSTORE_PRODUCT_ID/submissions/$subId"
                  $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($updatedJson)
                  Invoke-RestMethod -Method Put -Uri $putUri -Headers $headers -Body $bodyBytes | Out-Null
                  Write-Host "Successfully updated localized ReleaseNotes for $updatedCount locales via Partner Center API."
                }
              } else {
                Write-Warning "Could not parse JSON from 'msstore submission get'; skipping ReleaseNotes injection."
              }
            } else {
              Write-Host "Notes config version ($($notesConfig.version)) != tag ($cleanTag); skipping ReleaseNotes injection."
            }
          }

          # Step 3: Submit existing draft for certification & release unless no_commit=true
          if ($env:NO_COMMIT -ne 'true') {
            Write-Host "Submitting draft for Microsoft Store certification & release..."
            msstore submission publish $env:MSSTORE_PRODUCT_ID
            if ($LASTEXITCODE -ne 0) {
              Write-Error "msstore submission publish failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          } else {
            Write-Host "NO_COMMIT=true: draft saved without committing for review."
          }
