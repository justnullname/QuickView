name: WinGet Submission

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to submit (leave blank for latest release)'
        required: false
        default: ''

jobs:
  winget:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    name: Submit to WinGet
    runs-on: ubuntu-latest
    steps:
      - name: Determine Release Tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM_TAG="${{ inputs.release_tag }}"
          EVENT_TAG="${{ github.event.release.tag_name }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            # GitHub's /releases/latest endpoint strictly excludes draft and pre-release tags by specification
            RELEASE_JSON=$(gh api repos/${{ github.repository }}/releases/latest)
            IS_PRE=$(echo "$RELEASE_JSON" | jq -r '.prerelease')
            if [ "$IS_PRE" = "true" ]; then
              echo "::error::Target release is a pre-release! WinGet only accepts stable releases."
              exit 1
            fi
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected Stable Release Tag for WinGet: $TAG"

      - name: Auto-sync Fork with Microsoft Upstream
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          echo "Syncing fork justnullname/winget-pkgs with upstream microsoft/winget-pkgs..."
          if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/justnullname/winget-pkgs/merge-upstream \
              -f branch='master' 2>/dev/null; then
            echo "Successfully synced fork via merge-upstream API."
          else
            echo "API fast-forward skipped, applying robust shallow reset..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone --depth 1 https://x-access-token:${TOKEN}@github.com/justnullname/winget-pkgs.git /tmp/winget-fork
            cd /tmp/winget-fork
            git remote add upstream https://github.com/microsoft/winget-pkgs.git
            git fetch --depth 1 upstream master
            git reset --hard upstream/master
            git push --force origin master
            echo "Successfully force-synced fork master with upstream."
          fi

      - name: Resolve Installer URLs
        id: resolve-urls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          PKG_VERSION="${TAG#v}"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          URLS_STR=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '[.assets[] | select(.name | test(".*_Installer_.*\\.exe$")) | .browser_download_url] | join(" ")')
          if [ -z "$URLS_STR" ]; then
            echo "::error::No installer .exe assets found for release ${TAG}"
            exit 1
          fi
          echo "urls=$URLS_STR" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${PKG_VERSION}, urls=${URLS_STR}"

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install komac
        run: cargo-binstall komac -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and Normalize WinGet Manifests
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: GitHub Actions (QuickView)
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}
          FORCE_HYPERLINK: 0
        run: |
          PKG_VERSION="${{ steps.resolve-urls.outputs.version }}"
          read -r -a URLS <<< "${{ steps.resolve-urls.outputs.urls }}"
          mkdir -p ./winget-manifests
          komac update justnullname.QuickView \
            --version "$PKG_VERSION" \
            --urls "${URLS[@]}" \
            --output ./winget-manifests \
            --exit \
            --skip-pr-check

          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pyyaml

          python3 - << 'PYEOF'
          import pathlib
          import sys
          import yaml

          root = pathlib.Path("./winget-manifests")
          installer_files = list(root.rglob("*.installer.yaml"))
          if len(installer_files) != 1:
              print(f"::error::Expected 1 installer.yaml, found {len(installer_files)}: {installer_files}")
              sys.exit(1)

          path = installer_files[0]
          raw_lines = path.read_text(encoding="utf-8").splitlines()
          header_comments = []
          for line in raw_lines:
              if line.startswith("#") or line.strip() == "":
                  header_comments.append(line)
              else:
                  break

          data = yaml.safe_load("\n".join(raw_lines))
          installers = data.get("Installers") or []
          user_installers = [inst for inst in installers if inst.get("Scope", "user") == "user"]
          if not user_installers:
              print("::error::No user-scope installers remained after filtering!")
              sys.exit(1)

          cleaned_installers = []
          for inst in user_installers:
              item = dict(inst)
              item.pop("Scope", None)
              item.pop("InstallerSwitches", None)
              cleaned_installers.append(item)

          # Reorder root keys cleanly so root Scope & InstallerSwitches match published 6.40.1.1 baseline
          ordered = {}
          for k, v in data.items():
              if k in ("Scope", "InstallerSwitches", "Installers"):
                  continue
              ordered[k] = v
              if k == "InstallerType":
                  ordered["Scope"] = "user"
              elif k == "InstallModes":
                  ordered["InstallerSwitches"] = {"Custom": "/CURRENTUSER"}

          if "Scope" not in ordered:
              ordered["Scope"] = "user"
          if "InstallerSwitches" not in ordered:
              ordered["InstallerSwitches"] = {"Custom": "/CURRENTUSER"}

          manifest_type = ordered.pop("ManifestType", "installer")
          manifest_version = ordered.pop("ManifestVersion", "1.12.0")
          ordered["Installers"] = cleaned_installers
          ordered["ManifestType"] = manifest_type
          ordered["ManifestVersion"] = manifest_version

          dumped = yaml.safe_dump(ordered, sort_keys=False, allow_unicode=True)
          header_text = "\n".join(header_comments).rstrip()
          final_text = (header_text + "\n\n" + dumped) if header_text else dumped
          path.write_text(final_text, encoding="utf-8")

          print("=== Normalized Installer Manifest ===")
          print(final_text)
          PYEOF

      - name: Submit to WinGet
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          FORCE_HYPERLINK: 0
        run: |
          komac submit ./winget-manifests --yes
          komac cleanup --only-merged || true
